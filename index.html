<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>勇者公會成績看板 v8.0</title>

  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div id="guild-bg">

  <!-- 標題 -->
  <h1 id="guild-title">🛡️ 勇者公會 · 成績任務看板<span id="classNameLabel"></span></h1>

  <!-- 搜尋 -->
  <input id="searchBox" placeholder="🔍 搜尋勇者姓名..." oninput="renderTable()">

  <!-- 功能列 -->
  <div id="actionBar">

    <!-- 班級 / 成績單 -->
    <button onclick="openClassBox()">🏫 班級 / 成績單</button>

    <span class="divider"></span>

    <!-- 學童 -->
    <button onclick="openAddStudent()">＋ 新增學童</button>
    <button onclick="openDeleteStudentMenu()">🗑️ 刪除學童</button>

    <span class="divider"></span>

    <!-- 單元 -->
    <button onclick="openAddUnit()">＋ 新增單元</button>
    <button onclick="openDeleteUnitMenu()">🗑️ 刪除單元</button>
    <button onclick="openEditUnitMenu()">✏️ 編輯單元</button>
    <span class="divider"></span>

    <!-- 排序 -->
    <select id="sortSelect" onchange="setSortMode()">
      <option value="default">排序：自訂（拖移姓名）</option>
      <option value="avgHigh">平均分數（高→低）</option>
      <option value="avgLow">平均分數（低→高）</option>
      <option value="incomplete">未完成（少→多）</option>
      <option value="name">姓名（A→Z）</option>
    </select>

    <span class="divider"></span>

    <!-- Google Sheet 雙向同步 -->
    <button data-sheet-pull="1" onclick="syncFromSheet()">📥 從 Google Sheet 讀取</button>
    <button data-sheet-push="1" onclick="syncToSheet()">🧾 同步到 Google Sheet</button>

    <span class="divider"></span>

    <!-- 匯入 / 匯出 -->
    <button onclick="exportData()">📤 匯出資料</button>
    <button onclick="document.getElementById('importFile').click()">📥 匯入資料</button>
    <input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)">
  </div>

  <!-- 成績總表（三個區塊，由 main.js 產生） -->
  <div id="sectionsHost"></div>
</div>

<!-- 書卷彈窗 -->
<div id="scrollPopup" class="hidden">
  <div id="scrollContent">
    <div id="scrollClose" onclick="closeScroll()">✕</div>

    <h2 id="stuName" class="scroll-title"></h2>

    <h3 class="scroll-subtitle">📊 勇者總覽</h3>
    <div id="heroSummary" class="hero-cards"></div>

    <h3 class="scroll-subtitle">📌 待處理</h3>
    <div id="heroTodo"></div>

    <h3 class="scroll-subtitle">⚔️ 成績紀錄（依區塊）</h3>
    <table id="recordTable" class="scroll-table"></table>

    <h3 class="scroll-subtitle">📈 進度曲線（各單元最新）</h3>
    <canvas id="chartCanvas"></canvas>

    <h3 class="scroll-subtitle">🧝 精靈提示</h3>
    <p id="aiText"></p>
  </div>
</div>

<!-- 成績新增 / 修改 / 補考 視窗 -->
<div id="inputBox" class="hidden">
  <div id="inputInner">
    <h3 id="inputTitle"></h3>

    <label>日期：</label>
    <input id="inputDate" placeholder="例如：12/09">

    <label>分數：</label>
    <input id="inputScore" type="number" placeholder="例如：95">

    <label class="inline-check" style="margin-top:12px;">
      <input type="checkbox" id="inputAbsent" onchange="syncInputAbsent()"> 🚫 缺席（沒有出席，無法檢測）
    </label>

    <div class="modal-actions">
      <button class="primary" onclick="saveInput()">💾 儲存</button>
      <button class="ghost" onclick="closeInput()">取消</button>
    </div>
  </div>
</div>

<!-- 選擇 / 創建成績單（班級）視窗 -->
<div id="classBox" class="hidden">
  <div id="classInner">
    <div id="classClose" onclick="closeClassBox()">✕</div>

    <h3>🏫 選擇成績單</h3>
    <div id="classList"></div>

    <h3 class="class-new-title">＋ 創建新成績單（新班級）</h3>
    <label>班級名稱：</label>
    <input id="newClassName" placeholder="例如：五年甲班 / 115 上學期">

    <label>單元設定：</label>
    <select id="newClassCopyFrom"></select>

    <label class="inline-check">
      <input type="checkbox" id="newClassCopyStudents"> 同時複製學生名單（不含成績）
    </label>

    <div class="modal-actions">
      <button class="primary" onclick="createClass()">建立並開始使用</button>
    </div>
  </div>
</div>

<!-- 批量輸入成績視窗 -->
<div id="batchBox" class="hidden">
  <div id="batchInner">
    <h3 id="batchTitle">📝 批量輸入成績</h3>

    <label>單元：</label>
    <select id="batchUnit" onchange="renderBatchList()"></select>
    <input id="batchNewUnit" class="hidden" placeholder="新單元名稱，例如：1/5 單字" style="margin-top:8px;">

    <label>日期：</label>
    <input id="batchDate" placeholder="例如：12/09">

    <div class="batch-hint">分數空白＝這位不輸入｜按 A 或勾「缺席」＝沒出席無法檢測｜Enter / ↓ 跳下一位，最後一位按 Enter 儲存｜Esc 取消</div>

    <div id="batchListWrap">
      <table id="batchList" class="scroll-table"></table>
    </div>

    <div class="modal-actions">
      <button class="primary" onclick="saveBatch()">💾 全部儲存</button>
      <button class="ghost" onclick="closeBatch()">取消</button>
    </div>
  </div>
</div>

<!-- 新增單元視窗 -->
<div id="unitBox" class="hidden">
  <div id="unitInner">
    <h3>新增單元</h3>
    <label>區塊：</label>
    <select id="unitSection"></select>

    <label>單元名稱：</label>
    <input id="unitName" placeholder="例如：L11">

    <div class="modal-actions">
      <button class="primary" onclick="saveUnit()">儲存</button>
      <button class="ghost" onclick="closeUnit()">取消</button>
    </div>
  </div>
</div>

<!-- 新增學童視窗 -->
<div id="studentBox" class="hidden">
  <div id="studentInner">
    <h3>新增學童</h3>

    <label>年級：</label>
    <input id="studentGrade" placeholder="例如：五年級">

    <label>姓名：</label>
    <input id="studentName" placeholder="輸入姓名">

    <div class="modal-actions">
      <button class="primary" onclick="saveStudent()">儲存</button>
      <button class="ghost" onclick="closeStudent()">取消</button>
    </div>
  </div>
</div>

<!-- JS -->
<script src="js/data.js"></script>
<script src="js/main.js"></script>

</body>
</html>
